<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengalihkan · Deteksi bahasa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(145deg, #f0f4f8 0%, #e6ecf3 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
    }

    .redirect-card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 20, 40, 0.12), 0 8px 20px rgba(0, 0, 0, 0.05);
      padding: 40px 30px;
      text-align: center;
      transition: all 0.2s ease;
    }

    /* Círculo de progreso */
    .progress-ring {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 28px;
    }

    .ring {
      width: 80px;
      height: 80px;
      position: relative;
    }

    .ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring circle {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      r: 36;
      cx: 40;
      cy: 40;
    }

    .ring .bg-circle {
      stroke: #e2eaf2;
    }

    .ring .progress-circle {
      stroke: #00b4ff;
      stroke-dasharray: 226.2;
      stroke-dashoffset: 226.2;
      animation: progressFill 2.2s ease-out forwards;
      transition: stroke-dashoffset 0.1s;
    }

    @keyframes progressFill {
      0% {
        stroke-dashoffset: 226.2;
      }
      70% {
        stroke-dashoffset: 45.24;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    .ring .checkmark {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      font-weight: 600;
      color: #00b4ff;
      opacity: 0;
      animation: fadeInCheck 0.3s ease 2.2s forwards;
    }

    @keyframes fadeInCheck {
      to {
        opacity: 1;
      }
    }

    /* Texto dinámico */
    .status-title {
      font-size: 26px;
      font-weight: 800;
      color: #0b1a2e;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      min-height: 2.2rem;
    }

    .status-sub {
      font-size: 16px;
      color: #4a5f77;
      font-weight: 500;
      margin-bottom: 24px;
      min-height: 1.8rem;
    }

    /* Enlaces manuales */
    .fallback-links {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      border-top: 1px solid #e2eaf2;
      padding-top: 24px;
    }

    .fallback-links a {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .btn-es {
      background: #00b4ff;
      color: white;
      box-shadow: 0 4px 12px rgba(0, 180, 255, 0.25);
    }
    .btn-es:hover {
      background: #0099dd;
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0, 180, 255, 0.35);
    }

    .btn-en {
      background: #eef2f6;
      color: #0b1a2e;
    }
    .btn-en:hover {
      background: #d9e2ec;
      transform: translateY(-1px);
    }

    .btn-in {
      background: #f0eef6;
      color: #1e1a2e;
    }
    .btn-in:hover {
      background: #e0d9ec;
      transform: translateY(-1px);
    }

    .note {
      font-size: 13px;
      color: #7a8b9f;
      margin-top: 16px;
      font-weight: 400;
    }

    @media (max-width: 480px) {
      .redirect-card {
        padding: 28px 18px;
      }
      .status-title {
        font-size: 22px;
      }
      .fallback-links a {
        padding: 8px 16px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <!-- Círculo de progreso animado -->
    <div class="progress-ring">
      <div class="ring">
        <svg viewBox="0 0 80 80">
          <circle class="bg-circle" cx="40" cy="40" r="36" />
          <circle class="progress-circle" cx="40" cy="40" r="36" />
        </svg>
        <div class="checkmark">✓</div>
      </div>
    </div>

    <!-- Mensaje dinámico según el idioma detectado -->
    <div class="status-title" id="statusTitle">Detecting language...</div>
    <div class="status-sub" id="statusSub">Please wait a moment</div>

    <!-- Enlaces de respaldo -->
    <div class="fallback-links" id="fallbackLinks">
      <a href="index-es.html" class="btn-es" lang="es">Español</a>
      <a href="index-en.html" class="btn-en" lang="en">English</a>
      <a href="index-in.html" class="btn-in" lang="id">Bahasa Indonesia</a>
    </div>
    <div class="note">Serás redirigido automáticamente</div>
  </div>

  <script>
    (function() {
      // --- Configuración de idiomas y URLs ---
      // 'in' es el código ISO 639-1 para indonesio (aunque algunos navegadores usan 'id')
      const LANG_MAP = {
        es: {
          url: 'index-es.html',
          title: 'Detectando idioma…',
          sub: 'Redirigiendo a la versión en español'
        },
        en: {
          url: 'index-en.html',
          title: 'Detecting language…',
          sub: 'Redirecting to English version'
        },
        id: {
          url: 'index-in.html',
          title: 'Mendeteksi bahasa…',
          sub: 'Mengalihkan ke versi Bahasa Indonesia'
        }
      };

      const DEFAULT_LANG = 'en';

      // --- Detección de idioma ---
      function detectLanguage() {
        const supported = ['es', 'en', 'id'];

        // 1. Revisar navigator.languages (preferencias ordenadas)
        if (navigator.languages && navigator.languages.length) {
          for (let lang of navigator.languages) {
            const code = lang.toLowerCase().split('-')[0];
            // Normalizar 'in' (código antiguo) a 'id'
            const normalized = (code === 'in') ? 'id' : code;
            if (supported.includes(normalized)) {
              return normalized;
            }
          }
        }

        // 2. Fallback a navigator.language
        let navLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
        const baseCode = navLang.split('-')[0];
        const normalized = (baseCode === 'in') ? 'id' : baseCode;
        if (supported.includes(normalized)) {
          return normalized;
        }

        // 3. Inglés por defecto
        return DEFAULT_LANG;
      }

      // --- Referencias del DOM ---
      const statusTitle = document.getElementById('statusTitle');
      const statusSub = document.getElementById('statusSub');
      const fallbackLinks = document.getElementById('fallbackLinks');

      // --- Detectar idioma ---
      const detectedLang = detectLanguage();
      const langConfig = LANG_MAP[detectedLang] || LANG_MAP[DEFAULT_LANG];
      const targetUrl = langConfig.url;

      // Actualizar textos
      statusTitle.textContent = langConfig.title;
      statusSub.textContent = langConfig.sub;
      document.title = `🌐 ${langConfig.title}`;

      // Resaltar el enlace del idioma detectado
      const links = fallbackLinks.querySelectorAll('a');
      links.forEach(link => {
        if (link.getAttribute('href') === targetUrl) {
          link.style.boxShadow = '0 0 0 3px rgba(0, 180, 255, 0.3)';
          link.style.fontWeight = '700';
        } else {
          link.style.boxShadow = 'none';
          link.style.fontWeight = '600';
        }
      });

      // --- Redirección automática ---
      const REDIRECT_DELAY = 2400;
      const redirectTimer = setTimeout(() => {
        if (!document.hidden) {
          window.location.href = targetUrl;
        }
      }, REDIRECT_DELAY);

      // Cancelar redirección si el usuario hace clic manualmente
      links.forEach(link => {
        link.addEventListener('click', function() {
          clearTimeout(redirectTimer);
        });
      });

      // Ajustar el atributo lang del documento
      document.documentElement.lang = detectedLang;
    })();
  </script>
</body>
</html>
